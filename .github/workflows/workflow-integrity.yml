name: Workflow documentation integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation contract
        run: python scripts/check_workflow.py
      - name: Test evidence consistency rejection behavior
        run: python -m unittest discover -s tests -v
      - name: Validate the unevaluated template without inventing project GO
        run: python scripts/check_project.py templates/PROJECT_STATE.json --root .
